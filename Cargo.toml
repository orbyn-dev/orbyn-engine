[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
orbyn-auth-client = { path = "crates/orbyn-auth-client" }
orbyn-client = { path = "crates/orbyn-client" }
orbyn-contracts = { path = "crates/orbyn-contracts" }
orbyn-crypto = { path = "crates/orbyn-crypto" }
orbyn-sync = { path = "crates/orbyn-sync" }
orbyn-core = { path = "crates/orbyn-core" }
orbyn-planner = { path = "crates/orbyn-planner" }
orbyn-engineering = { path = "crates/orbyn-engineering" }
orbyn-server = { path = "crates/orbyn-server" }
orbyn-keyservice = { path = "crates/orbyn-keyservice" }
orbyn-translog = { path = "crates/orbyn-translog" }
orbyn-keyservice-server = { path = "crates/orbyn-keyservice-server" }
orbyn-keyservice-client = { path = "crates/orbyn-keyservice-client" }
orbyn-witness = { path = "crates/orbyn-witness" }
orbyn-store = { path = "crates/orbyn-store" }
orbyn-worker = { path = "crates/orbyn-worker" }

argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
getrandom = "0.4"
# OPAQUE (RFC 9807). opaque-ke 4.0 is built on the RustCrypto 0.10 generation, so its
# hash, key stretching and randomness come in at the versions it was released with.
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255", "argon2"] }
opaque-argon2 = { package = "argon2", version = "0.5", default-features = false, features = ["alloc"] }
opaque-getrandom = { package = "getrandom", version = "0.2" }
opaque-rand-core = { package = "rand_core", version = "0.6", features = ["getrandom"] }
opaque-sha2 = { package = "sha2", version = "0.10", default-features = false }
hkdf = "0.13"
# PKCS#11 for the key service (Apache-2.0). Only `orbyn-keyservice`, behind its `pkcs11` feature, uses it.
cryptoki = "0.12"
# NIST P-256 for the account service key (Standard protection). RustCrypto, Apache-2.0 OR MIT, and it
# builds for wasm.
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdh"] }
# TOTP (RFC 6238) is HMAC-SHA-1. Both are the RustCrypto 0.10 generation, which the OPAQUE stack already brings in.
hmac = "0.12"
sha1 = { version = "0.10", default-features = false }
# MIT OR Apache-2.0. Sends the worker's email over SMTP; TLS is rustls, with no native TLS library.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
# MIT OR Apache-2.0. The worker reads the extra SMTP CA bundle with it (already in the build through lettre).
rustls-pki-types = { version = "1", features = ["std"] }
# MIT OR Apache-2.0. Dev only: the worker's TLS test mail server. Same crate as lettre's TLS, with the ring provider.
# The internal API's mutual TLS: the client certificate's name is checked per endpoint with rustls's own
# name matching, and the connection is served with hyper directly so the verified certificate rides with it.
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# MIT OR Apache-2.0. Dev only: makes the tests' private CA and server certificates.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = { version = "2", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "json", "uuid", "chrono"] }
thiserror = "2"
url = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }
ts-rs = "12"
uuid = { version = "1", features = ["v4", "serde"] }
# MIT OR Apache-2.0. Only orbyn-wasm uses it.
wasm-bindgen = "0.2.100"
x25519-dalek = { version = "3", default-features = false, features = ["precomputed-tables", "static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Argon2 runs in tests (recovery keys, OPAQUE key stretching); unoptimized it takes seconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
